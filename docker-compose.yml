services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-crm}"]
      interval: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm_dev_pw}@db:5432/${POSTGRES_DB:-crm}?sslmode=disable
      PORT: "8080"
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["3000:80"]
volumes:
  pgdata:
